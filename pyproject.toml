[project]
name = "anomaly-pipeline"
version = "0.1.0"
description = "Learned anomaly detector for a market data pipeline, compared against a z-score rule."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.16.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Docker Compose test is slow; run it with `pytest -m integration` (or `make integration`).
addopts = "-m 'not integration'"
markers = ["integration: starts the full pipeline in Docker Compose"]

[tool.ruff]
line-length = 100

# On Linux (CI), install the CPU-only PyTorch build: the default one pulls in
# several GB of CUDA libraries that CI never uses. macOS uses the normal build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
